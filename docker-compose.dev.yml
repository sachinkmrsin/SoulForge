services:
  postgres:
    image: postgres:16-alpine
    container_name: soul-warrior-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soulwarrior}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soulwarrior}
      POSTGRES_DB: ${POSTGRES_DB:-soulwarrior_chronicle}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soulwarrior} -d ${POSTGRES_DB:-soulwarrior_chronicle}"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-push:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
      target: build
    container_name: soul-warrior-db-push
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://soulwarrior:soulwarrior@postgres:5432/soulwarrior_chronicle}
    command: pnpm --filter @workspace/db run push
    restart: "no"

  api-server:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
      target: build
    container_name: soul-warrior-api-dev
    restart: unless-stopped
    depends_on:
      db-push:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://soulwarrior:soulwarrior@postgres:5432/soulwarrior_chronicle}
      PORT: ${API_PORT:-5000}
      NODE_ENV: development
      AI_INTEGRATIONS_OPENAI_BASE_URL: ${AI_INTEGRATIONS_OPENAI_BASE_URL:-}
      AI_INTEGRATIONS_OPENAI_API_KEY: ${AI_INTEGRATIONS_OPENAI_API_KEY:-}
    ports:
      - "${API_PORT:-5000}:5000"
    command: sh -c "pnpm --filter @workspace/api-server run build && node --enable-source-maps ./artifacts/api-server/dist/index.mjs"
    volumes:
      - ./artifacts/api-server/src:/app/artifacts/api-server/src
      - ./lib:/app/lib
    develop:
      watch:
        - path: ./artifacts/api-server/src
          action: sync+restart
          target: /app/artifacts/api-server/src
        - path: ./lib
          action: sync+restart
          target: /app/lib
          ignore:
            - "**/node_modules"
            - "**/dist"
            - "**/*.tsbuildinfo"

  soulforge:
    build:
      context: .
      dockerfile: artifacts/soulforge/Dockerfile
      target: deps
    container_name: soul-warrior-frontend-dev
    restart: unless-stopped
    depends_on:
      - api-server
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
      API_URL: http://api-server:5000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    command: sh -c "cd artifacts/soulforge && pnpm exec vite --config vite.config.ts --host 0.0.0.0"
    volumes:
      - ./artifacts/soulforge/src:/app/artifacts/soulforge/src
      - ./artifacts/soulforge/vite.config.ts:/app/artifacts/soulforge/vite.config.ts
      - ./artifacts/soulforge/tsconfig.json:/app/artifacts/soulforge/tsconfig.json
      - ./lib:/app/lib
      - ./tsconfig.base.json:/app/tsconfig.base.json
      - ./tsconfig.json:/app/tsconfig.json
    develop:
      watch:
        - path: ./artifacts/soulforge/src
          action: sync
          target: /app/artifacts/soulforge/src
        - path: ./artifacts/soulforge/vite.config.ts
          action: sync+restart
          target: /app/artifacts/soulforge/vite.config.ts
        - path: ./lib
          action: sync
          target: /app/lib
          ignore:
            - "**/node_modules"
            - "**/dist"
            - "**/*.tsbuildinfo"

volumes:
  postgres_data:
