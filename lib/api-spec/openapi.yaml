openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: SoulForge API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: player
    description: Player profile and stats
  - name: goals
    description: Goal tracking
  - name: subtasks
    description: Goal subtasks
  - name: habits
    description: Habit tracking
  - name: bosses
    description: Boss battles
  - name: challenges
    description: AI challenges
  - name: inventory
    description: Loot and inventory
  - name: skills
    description: Player skills
  - name: calendar
    description: Calendar and tracking
  - name: leaderboard
    description: Player leaderboard
  - name: dashboard
    description: Dashboard summary

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # AUTH
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # PLAYER
  /player:
    get:
      operationId: getPlayer
      tags: [player]
      summary: Get player profile
      responses:
        "200":
          description: Player profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
    patch:
      operationId: updatePlayer
      tags: [player]
      summary: Update player profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerUpdate"
      responses:
        "200":
          description: Updated player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /player/avatar:
    patch:
      operationId: updatePlayerAvatar
      tags: [player]
      summary: Update player avatar class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvatarUpdate"
      responses:
        "200":
          description: Updated player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  # GOALS
  /goals:
    get:
      operationId: listGoals
      tags: [goals]
      summary: List all goals
      responses:
        "200":
          description: List of goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
    post:
      operationId: createGoal
      tags: [goals]
      summary: Create a goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "201":
          description: Created goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"

  /goals/{goalId}:
    get:
      operationId: getGoal
      tags: [goals]
      summary: Get a goal by ID
      parameters:
        - name: goalId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalWithSubtasks"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateGoal
      tags: [goals]
      summary: Update a goal
      parameters:
        - name: goalId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalUpdate"
      responses:
        "200":
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
    delete:
      operationId: deleteGoal
      tags: [goals]
      summary: Delete a goal
      parameters:
        - name: goalId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /goals/{goalId}/complete:
    post:
      operationId: completeGoal
      tags: [goals]
      summary: Mark goal as complete (awards XP)
      parameters:
        - name: goalId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Completed goal with XP gained
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XPResult"

  # SUBTASKS
  /goals/{goalId}/subtasks:
    get:
      operationId: listSubtasks
      tags: [subtasks]
      summary: List subtasks for a goal
      parameters:
        - name: goalId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of subtasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subtask"
    post:
      operationId: createSubtask
      tags: [subtasks]
      summary: Create a subtask
      parameters:
        - name: goalId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubtaskInput"
      responses:
        "201":
          description: Created subtask
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subtask"

  /goals/{goalId}/subtasks/{subtaskId}:
    patch:
      operationId: updateSubtask
      tags: [subtasks]
      summary: Update a subtask
      parameters:
        - name: goalId
          in: path
          required: true
          schema:
            type: integer
        - name: subtaskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubtaskUpdate"
      responses:
        "200":
          description: Updated subtask
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subtask"
    delete:
      operationId: deleteSubtask
      tags: [subtasks]
      summary: Delete a subtask
      parameters:
        - name: goalId
          in: path
          required: true
          schema:
            type: integer
        - name: subtaskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /goals/{goalId}/subtasks/{subtaskId}/complete:
    post:
      operationId: completeSubtask
      tags: [subtasks]
      summary: Complete a subtask (awards XP, damages boss)
      parameters:
        - name: goalId
          in: path
          required: true
          schema:
            type: integer
        - name: subtaskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: XP and boss damage result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XPResult"

  # HABITS
  /habits:
    get:
      operationId: listHabits
      tags: [habits]
      summary: List habits sorted by time of day
      responses:
        "200":
          description: Habits list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Habit"
    post:
      operationId: createHabit
      tags: [habits]
      summary: Create a habit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitInput"
      responses:
        "201":
          description: Created habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"

  /habits/{habitId}:
    patch:
      operationId: updateHabit
      tags: [habits]
      summary: Update a habit
      parameters:
        - name: habitId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitUpdate"
      responses:
        "200":
          description: Updated habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
    delete:
      operationId: deleteHabit
      tags: [habits]
      summary: Delete a habit
      parameters:
        - name: habitId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /habits/{habitId}/checkin:
    post:
      operationId: checkinHabit
      tags: [habits]
      summary: Check in a habit for today (awards XP, damages boss)
      parameters:
        - name: habitId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Checkin result with XP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XPResult"

  # BOSSES
  /bosses:
    get:
      operationId: listBosses
      tags: [bosses]
      summary: List available bosses
      responses:
        "200":
          description: Boss list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Boss"
    post:
      operationId: createCustomBoss
      tags: [bosses]
      summary: Create a custom boss (pro feature)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BossInput"
      responses:
        "201":
          description: Created boss
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Boss"

  /bosses/active:
    get:
      operationId: getActiveBoss
      tags: [bosses]
      summary: Get currently challenged boss
      responses:
        "200":
          description: Active boss battle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BossBattle"
        "404":
          description: No active boss
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bosses/active/attack:
    post:
      operationId: attackBoss
      tags: [bosses]
      summary: Attack active boss (uses daily task points)
      responses:
        "200":
          description: Attack result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttackResult"

  /bosses/history:
    get:
      operationId: listBossHistory
      tags: [bosses]
      summary: List defeated bosses
      responses:
        "200":
          description: Boss history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BossVictory"

  /bosses/{bossId}/challenge:
    post:
      operationId: challengeBoss
      tags: [bosses]
      summary: Start challenging a boss
      parameters:
        - name: bossId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Boss battle started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BossBattle"

  # AI CHALLENGES
  /challenges:
    get:
      operationId: listChallenges
      tags: [challenges]
      summary: List AI-generated challenges
      responses:
        "200":
          description: Challenges list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Challenge"

  /challenges/generate:
    post:
      operationId: generateChallenges
      tags: [challenges]
      summary: Generate AI challenges for a goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeGenerateInput"
      responses:
        "201":
          description: Generated challenges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Challenge"

  /challenges/{challengeId}:
    patch:
      operationId: updateChallenge
      tags: [challenges]
      summary: Update a challenge
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeUpdate"
      responses:
        "200":
          description: Updated challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"

  /challenges/{challengeId}/complete:
    post:
      operationId: completeChallenge
      tags: [challenges]
      summary: Complete a challenge (awards bonus XP)
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: XP result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XPResult"

  # INVENTORY
  /inventory:
    get:
      operationId: listInventory
      tags: [inventory]
      summary: Get player inventory
      responses:
        "200":
          description: Inventory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"

  /inventory/{itemId}:
    delete:
      operationId: discardItem
      tags: [inventory]
      summary: Discard an inventory item
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Discarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # SKILLS
  /skills:
    get:
      operationId: listSkills
      tags: [skills]
      summary: List all skills (unlocked by level)
      responses:
        "200":
          description: Skills list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Skill"

  /skills/{skillId}/equip:
    post:
      operationId: equipSkill
      tags: [skills]
      summary: Equip a skill
      parameters:
        - name: skillId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
    delete:
      operationId: unequipSkill
      tags: [skills]
      summary: Unequip a skill
      parameters:
        - name: skillId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  # CALENDAR
  /calendar:
    get:
      operationId: getCalendar
      tags: [calendar]
      summary: Get calendar entries for a month
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: month
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Calendar data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarDay"

  /calendar/{date}:
    get:
      operationId: getCalendarDay
      tags: [calendar]
      summary: Get entries for a specific date
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Day entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarDay"

  # DASHBOARD
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary (player stats, boss, streak, activity)
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  # LEADERBOARD
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Get top players ranked by level and XP
      responses:
        "200":
          description: Leaderboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    # AUTH
    AuthInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 6

    User:
      type: object
      required: [id, username, createdAt, isPro]
      properties:
        id:
          type: integer
        username:
          type: string
        createdAt:
          type: string
        isPro:
          type: boolean

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string

    # PLAYER
    Player:
      type: object
      required: [id, userId, username, level, xp, xpToNextLevel, hp, maxHp, gold, strength, endurance, dexterity, faith, avatarClass, equippedSkills, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        username:
          type: string
        level:
          type: integer
        xp:
          type: integer
        xpToNextLevel:
          type: integer
        hp:
          type: integer
        maxHp:
          type: integer
        gold:
          type: integer
        strength:
          type: integer
        endurance:
          type: integer
        dexterity:
          type: integer
        faith:
          type: integer
        avatarClass:
          type: string
        equippedSkills:
          type: array
          items:
            type: string
        createdAt:
          type: string

    PlayerUpdate:
      type: object
      properties:
        username:
          type: string

    AvatarUpdate:
      type: object
      required: [avatarClass]
      properties:
        avatarClass:
          type: string

    # XP Result
    XPResult:
      type: object
      required: [xpGained, player, leveledUp, loot]
      properties:
        xpGained:
          type: integer
        player:
          $ref: "#/components/schemas/Player"
        leveledUp:
          type: boolean
        bossHpReduced:
          type: ["integer", "null"]
        loot:
          type: array
          items:
            $ref: "#/components/schemas/InventoryItem"

    # GOALS
    Goal:
      type: object
      required: [id, userId, title, description, status, priority, xpReward, deadline, createdAt, completedAt, subtaskCount, completedSubtaskCount]
      properties:
        id:
          type: integer
        userId:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, completed, abandoned]
        priority:
          type: string
          enum: [low, medium, high, legendary]
        xpReward:
          type: integer
        deadline:
          type: ["string", "null"]
        createdAt:
          type: string
        completedAt:
          type: ["string", "null"]
        subtaskCount:
          type: integer
        completedSubtaskCount:
          type: integer

    GoalWithSubtasks:
      type: object
      required: [id, userId, title, description, status, priority, xpReward, deadline, createdAt, completedAt, subtasks]
      properties:
        id:
          type: integer
        userId:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, completed, abandoned]
        priority:
          type: string
          enum: [low, medium, high, legendary]
        xpReward:
          type: integer
        deadline:
          type: ["string", "null"]
        createdAt:
          type: string
        completedAt:
          type: ["string", "null"]
        subtasks:
          type: array
          items:
            $ref: "#/components/schemas/Subtask"

    GoalInput:
      type: object
      required: [title, priority]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        priority:
          type: string
          enum: [low, medium, high, legendary]
        deadline:
          type: string
        xpReward:
          type: integer

    GoalUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        priority:
          type: string
          enum: [low, medium, high, legendary]
        deadline:
          type: string
        status:
          type: string
          enum: [active, completed, abandoned]

    # SUBTASKS
    Subtask:
      type: object
      required: [id, goalId, userId, title, completed, xpReward, createdAt, completedAt]
      properties:
        id:
          type: integer
        goalId:
          type: integer
        userId:
          type: integer
        title:
          type: string
        completed:
          type: boolean
        xpReward:
          type: integer
        createdAt:
          type: string
        completedAt:
          type: ["string", "null"]

    SubtaskInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        xpReward:
          type: integer

    SubtaskUpdate:
      type: object
      properties:
        title:
          type: string
        completed:
          type: boolean

    # HABITS
    Habit:
      type: object
      required: [id, userId, title, description, frequency, timeOfDay, xpReward, streak, lastCheckin, createdAt, completedToday]
      properties:
        id:
          type: integer
        userId:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        frequency:
          type: string
          enum: [daily, weekly]
        timeOfDay:
          type: string
          enum: [morning, afternoon, evening, anytime]
        xpReward:
          type: integer
        streak:
          type: integer
        lastCheckin:
          type: ["string", "null"]
        createdAt:
          type: string
        completedToday:
          type: boolean

    HabitInput:
      type: object
      required: [title, frequency, timeOfDay]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        frequency:
          type: string
          enum: [daily, weekly]
        timeOfDay:
          type: string
          enum: [morning, afternoon, evening, anytime]
        xpReward:
          type: integer

    HabitUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        frequency:
          type: string
          enum: [daily, weekly]
        timeOfDay:
          type: string
          enum: [morning, afternoon, evening, anytime]
        xpReward:
          type: integer

    # BOSSES
    Boss:
      type: object
      required: [id, name, description, difficulty, maxHp, xpReward, goldReward, lootTable, imageUrl, isCustom, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        difficulty:
          type: string
          enum: [easy, medium, hard, legendary]
        maxHp:
          type: integer
        xpReward:
          type: integer
        goldReward:
          type: integer
        lootTable:
          type: array
          items:
            type: string
        imageUrl:
          type: ["string", "null"]
        isCustom:
          type: boolean
        createdAt:
          type: string

    BossInput:
      type: object
      required: [name, description, difficulty, maxHp]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        difficulty:
          type: string
          enum: [easy, medium, hard, legendary]
        maxHp:
          type: integer
        xpReward:
          type: integer
        goldReward:
          type: integer

    BossBattle:
      type: object
      required: [id, userId, boss, currentHp, startedAt, attackPoints]
      properties:
        id:
          type: integer
        userId:
          type: integer
        boss:
          $ref: "#/components/schemas/Boss"
        currentHp:
          type: integer
        startedAt:
          type: string
        attackPoints:
          type: integer

    AttackResult:
      type: object
      required: [damage, bossBattle, bossDefeated, loot, xpGained, player]
      properties:
        damage:
          type: integer
        bossBattle:
          $ref: "#/components/schemas/BossBattle"
        bossDefeated:
          type: boolean
        loot:
          type: array
          items:
            $ref: "#/components/schemas/InventoryItem"
        xpGained:
          type: integer
        player:
          $ref: "#/components/schemas/Player"

    BossVictory:
      type: object
      required: [id, boss, defeatedAt, xpEarned, goldEarned]
      properties:
        id:
          type: integer
        boss:
          $ref: "#/components/schemas/Boss"
        defeatedAt:
          type: string
        xpEarned:
          type: integer
        goldEarned:
          type: integer

    # AI CHALLENGES
    Challenge:
      type: object
      required: [id, userId, goalId, title, description, duration, difficulty, xpReward, status, createdAt, completedAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        goalId:
          type: ["integer", "null"]
        title:
          type: string
        description:
          type: string
        duration:
          type: string
          enum: [daily, weekly, monthly]
        difficulty:
          type: string
          enum: [easy, medium, hard, legendary]
        xpReward:
          type: integer
        status:
          type: string
          enum: [active, completed, abandoned]
        createdAt:
          type: string
        completedAt:
          type: ["string", "null"]

    ChallengeGenerateInput:
      type: object
      required: [goalId, duration]
      properties:
        goalId:
          type: integer
        duration:
          type: string
          enum: [daily, weekly, monthly]
        count:
          type: integer

    ChallengeUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [active, completed, abandoned]

    # INVENTORY
    InventoryItem:
      type: object
      required: [id, userId, name, description, rarity, type, obtainedAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        name:
          type: string
        description:
          type: string
        rarity:
          type: string
          enum: [common, uncommon, rare, epic, legendary]
        type:
          type: string
          enum: [weapon, armor, accessory, consumable, trophy]
        obtainedAt:
          type: string

    # SKILLS
    Skill:
      type: object
      required: [id, name, description, effect, levelRequired, isEquipped, isUnlocked]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        effect:
          type: string
        levelRequired:
          type: integer
        isEquipped:
          type: boolean
        isUnlocked:
          type: boolean

    # CALENDAR
    CalendarDay:
      type: object
      required: [date, habitsCompleted, habitsTotal, subtasksCompleted, xpEarned, hasCheckin]
      properties:
        date:
          type: string
        habitsCompleted:
          type: integer
        habitsTotal:
          type: integer
        subtasksCompleted:
          type: integer
        xpEarned:
          type: integer
        hasCheckin:
          type: boolean

    # DASHBOARD
    DashboardSummary:
      type: object
      required: [player, activeBoss, streak, todayXp, weeklyXp, goalsActive, goalsCompleted, habitsCompletedToday, habitsTotal, recentActivity]
      properties:
        player:
          $ref: "#/components/schemas/Player"
        activeBoss:
          $ref: "#/components/schemas/BossBattle"
        streak:
          type: integer
        todayXp:
          type: integer
        weeklyXp:
          type: integer
        goalsActive:
          type: integer
        goalsCompleted:
          type: integer
        habitsCompletedToday:
          type: integer
        habitsTotal:
          type: integer
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityEntry"

    ActivityEntry:
      type: object
      required: [id, type, description, xpGained, timestamp]
      properties:
        id:
          type: integer
        type:
          type: string
        description:
          type: string
        xpGained:
          type: integer
        timestamp:
          type: string

    # LEADERBOARD
    LeaderboardEntry:
      type: object
      required: [rank, username, level, xp, avatarClass]
      properties:
        rank:
          type: integer
        username:
          type: string
        level:
          type: integer
        xp:
          type: integer
        avatarClass:
          type: string

    LeaderboardResponse:
      type: object
      required: [entries, currentRank]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
        currentRank:
          type: ["object", "null"]
          properties:
            rank:
              type: integer
            username:
              type: string
            level:
              type: integer
            xp:
              type: integer
            avatarClass:
              type: string
